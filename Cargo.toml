[package]
name = "rust-island"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.9"
tokio = { version = "1.38", features = ["full"] }
sysinfo = "0.30"
arboard = "3.4"
mpris = "2.0"
image = { version = "0.24", features = ["webp", "jpeg", "png"] }
zbus = "4.0"
chrono = "0.4"
rodio = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
reqwest = "0.12"
url = "2.5"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.9"
